  propagation: [{from: argument(0), to: this}]
# PHP manual: returns an element the container holds.
- subject: {method: ArrayIterator::current}
  returns: any
  propagation: [{from: this, to: return}]
# PHP manual: returns an element the container holds.
- subject: {method: ArrayIterator::getArrayCopy}
  returns: any
  propagation: [{from: this, to: return}]
# PHP manual: returns an element the container holds.
- subject: {method: ArrayIterator::offsetGet}
  returns: any
  propagation: [{from: this, to: return}]
# PHP manual: stores the value argument in the container.
- subject: {method: ArrayIterator::offsetSet}
  returns: any
  propagation: [{from: argument(1), to: this}]
# Immediate invocation; retains the ordinary result inputs of the existing summary or its default.
- subject: {method: ArrayIterator::uasort}
