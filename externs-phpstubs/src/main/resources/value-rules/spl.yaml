# Hand-maintained value rules set: value units the generated set lacks or states wrongly.
# SPL containers (PHP manual: SPL Data Structures): receiver stores and element reads.
# An entry whose unit differs from the generated one carries the PHP manual reason above it.

# Immediate invocation; retains the ordinary result inputs of the existing summary or its default.
- subject: {function: iterator_apply}
  returns: any
  callbacks:
    - callable: {kind: argument, position: 1}
      supply: {kind: unpacked, position: 2}
  propagation:
    - {from: argument(0), to: return}
    - {from: argument(1), to: return}
    - {from: argument(2), to: return}
