# Hand-maintained value rules set: value units the generated set lacks or states wrongly.
# Date and time (PHP manual: Date/Time).
# An entry whose unit differs from the generated one carries the PHP manual reason above it.

- subject: {function: date}
  returns: str
# PHP manual: the date object is modified and returned itself; the other arguments set its fields.
- subject: {function: date_add}
  returns: any
  propagation:
    - {from: argument(0), to: return, unchanged: true}
    - {from: argument(1), to: return}
