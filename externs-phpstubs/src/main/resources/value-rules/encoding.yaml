# Hand-maintained value rules set: value units the generated set lacks or states wrongly.
# Data encoding (PHP manual: URLs, MongoDB BSON).
# An entry whose unit differs from the generated one carries the PHP manual reason above it.

- subject: {function: urlencode}
  returns: str
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns the string percent-encoded (RFC 3986); rawurldecode restores it.
- subject: {function: rawurlencode}
  returns: str
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns the PHP value of the BSON document in bson; typemap only selects the container class of the result.
- subject: {function: mongodb\bson\tophp}
  returns: any
  propagation: [{from: argument(0), to: return}]
