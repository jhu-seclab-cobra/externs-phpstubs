# Hand-maintained value rules set: value units the generated set lacks or states wrongly.
# Database access (PHP manual: MySQLi, PDO, PostgreSQL, SQLite3).
# An entry whose unit differs from the generated one carries the PHP manual reason above it.

# PHP manual: returns bool; the generated entry's bool return type is confirmed.
- subject: {function: mysqli_multi_query}
  returns: bool
  propagation: [{from: argument(1), to: return}]
# PHP manual: returns a mysqli_result, true, or false depending on the query.
- subject: {function: mysqli_query}
  returns: any
  propagation: [{from: argument(1), to: return}]
- subject: {function: mysqli_real_escape_string}
  returns: str
  propagation: [{from: argument(1), to: return}]
# PHP manual: returns bool; the generated entry's bool return type is confirmed.
- subject: {function: mysqli_real_query}
  returns: bool
  propagation: [{from: argument(1), to: return}]
- subject: {function: pg_query}
  returns: any
  propagation: [{from: argument(1), to: return}]
# PHP manual: returns true, false, or 0 when the connection is busy.
- subject: {function: pg_send_query}
  returns: any
  propagation: [{from: argument(1), to: return}]
# PHP manual: returns the affected row count or false.
- subject: {method: PDO::exec}
  returns: any
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns a PDOStatement or false.
- subject: {method: PDO::query}
  returns: any
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns bool.
- subject: {method: SQLite3::exec}
  returns: bool
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns an SQLite3Result or false.
- subject: {method: SQLite3::query}
  returns: any
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns bool.
- subject: {method: mysqli::multi_query}
  returns: bool
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns a mysqli_result, true, or false depending on the query.
- subject: {method: mysqli::query}
  returns: any
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns bool.
- subject: {method: mysqli::real_query}
  returns: bool
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns the string escaped for a PostgreSQL query; the connection argument is optional, so the string is
# argument(0) without it and argument(1) with it.
- subject: {function: pg_escape_string}
  returns: str
  propagation: [{from: argument(0), to: return}, {from: argument(1), to: return}]
# PHP manual: returns the string quoted as a PostgreSQL literal, or false; the string is argument(0) without the
# optional connection and argument(1) with it.
- subject: {function: pg_escape_literal}
  returns: any
  propagation: [{from: argument(0), to: return}, {from: argument(1), to: return}]
# PHP manual: returns the string quoted as a PostgreSQL identifier, or false; the string is argument(0) without the
# optional connection and argument(1) with it.
- subject: {function: pg_escape_identifier}
  returns: any
  propagation: [{from: argument(0), to: return}, {from: argument(1), to: return}]
# PHP manual: returns the string with special characters escaped for a mysqli statement.
- subject: {method: mysqli::escape_string}
  returns: str
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns the string with special characters escaped for a mysqli statement.
- subject: {method: mysqli::real_escape_string}
  returns: str
  propagation: [{from: argument(0), to: return}]
# PHP manual: returns the string escaped for use in an SQLite query.
- subject: {method: SQLite3::escapeString}
  returns: str
  propagation: [{from: argument(0), to: return}]
