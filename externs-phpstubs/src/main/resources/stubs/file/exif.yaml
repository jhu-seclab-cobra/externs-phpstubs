- tag: function
  name: exif_imagetype
  params:
    - { name: filename, type: string }
  return: int

- tag: function
  name: exif_read_data
  params:
    - { name: file, type: resource }
    - { name: required_sections, type: string, optional: true }
    - { name: as_arrays, type: bool, optional: true }
    - { name: read_thumbnail, type: bool, optional: true }
  return: array

- tag: function
  name: exif_tagname
  params:
    - { name: index, type: int }
  return: string

- tag: function
  name: exif_thumbnail
  params:
    - { name: file, type: string }
    - { name: width, type: int, optional: true }
    - { name: height, type: int, optional: true }
    - { name: image_type, type: int, optional: true }
  return: string
  flowsToReturn: [0]

