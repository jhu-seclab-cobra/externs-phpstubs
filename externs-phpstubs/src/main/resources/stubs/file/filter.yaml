- tag: function
  name: filter_has_var
  params:
    - { name: input_type, type: mixed }
    - { name: var_name, type: string }
  return: bool

- tag: function
  name: filter_id
  params:
    - { name: name, type: string }
  return: int

- tag: function
  name: filter_input
  params:
    - { name: type, type: mixed }
    - { name: var_name, type: string }
    - { name: filter, type: int, optional: true }
    - { name: options, type: array, optional: true }

- tag: function
  name: filter_input_array
  params:
    - { name: type, type: mixed }
    - { name: options, type: array, optional: true }
    - { name: add_empty, type: bool, optional: true }
  return: array
  flowsToReturn: [0, 1]

- tag: function
  name: filter_list
  return: array

- tag: function
  name: filter_var
  params:
    - { name: value, type: mixed }
    - { name: filter, type: int, optional: true }
    - { name: options, type: array, optional: true }

- tag: function
  name: filter_var_array
  params:
    - { name: array, type: array }
    - { name: options, type: array, optional: true }
    - { name: add_empty, type: bool, optional: true }
  return: array
  flowsToReturn: [0, 1]

