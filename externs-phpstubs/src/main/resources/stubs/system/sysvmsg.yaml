- tag: function
  name: msg_get_queue
  params:
    - { name: key, type: int }
    - { name: permissions, type: int, optional: true }
  flowsToReturn: [0, 1]

- tag: function
  name: msg_queue_exists
  params:
    - { name: key, type: int }
  return: bool

- tag: function
  name: msg_receive
  params:
    - { name: queue, type: mixed }
    - { name: desired_message_type, type: int }
    - { name: received_message_type, type: int }
    - { name: max_message_size, type: int }
    - { name: message, type: mixed }
    - { name: unserialize, type: bool, optional: true }
    - { name: flags, type: int, optional: true }
    - { name: error_code, type: int, optional: true }
  return: bool

- tag: function
  name: msg_remove_queue
  params:
    - { name: queue, type: mixed }
  return: bool

- tag: function
  name: msg_send
  params:
    - { name: queue, type: mixed }
    - { name: message_type, type: int }
    - { name: message, type: mixed }
    - { name: serialize, type: bool, optional: true }
    - { name: blocking, type: bool, optional: true }
    - { name: error_code, type: int, optional: true }
  return: bool

- tag: function
  name: msg_set_queue
  params:
    - { name: queue, type: mixed }
    - { name: data, type: array }
  return: bool

- tag: function
  name: msg_stat_queue
  params:
    - { name: queue, type: mixed }
  return: array
  flowsToReturn: [0]

