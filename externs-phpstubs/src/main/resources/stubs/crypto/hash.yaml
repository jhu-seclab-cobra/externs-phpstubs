- tag: function
  name: hash
  params:
    - { name: algo, type: string }
    - { name: data, type: string }
    - { name: binary, type: bool, optional: true }
  return: string

- tag: function
  name: hash_algos
  return: array

- tag: function
  name: hash_copy
  params:
    - { name: context, type: mixed }
  flowsToReturn: [0]

- tag: function
  name: hash_equals
  params:
    - { name: known_string, type: string }
    - { name: user_string, type: string }
  return: bool

- tag: function
  name: hash_file
  params:
    - { name: algo, type: string }
    - { name: filename, type: string }
    - { name: binary, type: bool, optional: true }
  return: string
  flowsToReturn: [0, 1]

- tag: function
  name: hash_final
  params:
    - { name: context, type: mixed }
    - { name: binary, type: bool, optional: true }
  return: string
  flowsToReturn: [0]

- tag: function
  name: hash_hkdf
  params:
    - { name: algo, type: string }
    - { name: key, type: string }
    - { name: length, type: int, optional: true }
    - { name: info, type: string, optional: true }
    - { name: salt, type: string, optional: true }
  return: string
  flowsToReturn: [0, 1, 3, 4]

- tag: function
  name: hash_hmac
  params:
    - { name: algo, type: string }
    - { name: data, type: string }
    - { name: key, type: string }
    - { name: binary, type: bool, optional: true }
  return: string
  flowsToReturn: [0, 1, 2]

- tag: function
  name: hash_hmac_algos
  return: array

- tag: function
  name: hash_hmac_file
  params:
    - { name: algo, type: string }
    - { name: filename, type: string }
    - { name: key, type: string }
    - { name: binary, type: bool, optional: true }
  return: string
  flowsToReturn: [0, 1, 2]

- tag: function
  name: hash_init
  params:
    - { name: algo, type: string }
    - { name: flags, type: int, optional: true }
    - { name: key, type: string, optional: true }
  flowsToReturn: [0, 1, 2]

- tag: function
  name: hash_pbkdf2
  params:
    - { name: algo, type: string }
    - { name: password, type: string }
    - { name: salt, type: string }
    - { name: iterations, type: int }
    - { name: length, type: int, optional: true }
    - { name: binary, type: bool, optional: true }
  return: string
  flowsToReturn: [0, 1, 2]

- tag: function
  name: hash_update
  params:
    - { name: context, type: mixed }
    - { name: data, type: string }
  return: bool

- tag: function
  name: hash_update_file
  params:
    - { name: context, type: mixed }
    - { name: filename, type: string }
    - { name: stream_context, type: resource, optional: true }
  return: bool

- tag: function
  name: hash_update_stream
  params:
    - { name: context, type: mixed }
    - { name: stream, type: resource }
    - { name: length, type: int, optional: true }
  return: int

