- tag: function
  name: xml_error_string
  params:
    - { name: error_code, type: int }
  return: string

- tag: function
  name: xml_get_current_byte_index
  params:
    - { name: parser, type: mixed }
  return: int

- tag: function
  name: xml_get_current_column_number
  params:
    - { name: parser, type: mixed }
  return: int

- tag: function
  name: xml_get_current_line_number
  params:
    - { name: parser, type: mixed }
  return: int

- tag: function
  name: xml_get_error_code
  params:
    - { name: parser, type: mixed }
  return: int

- tag: function
  name: xml_parse
  params:
    - { name: parser, type: mixed }
    - { name: data, type: string }
    - { name: is_final, type: bool, optional: true }
  return: int

- tag: function
  name: xml_parse_into_struct
  params:
    - { name: parser, type: mixed }
    - { name: data, type: string }
    - { name: values, type: array }
    - { name: index, type: array, optional: true }
  return: int

- tag: function
  name: xml_parser_create
  params:
    - { name: encoding, type: string, optional: true }
  flowsToReturn: [0]

- tag: function
  name: xml_parser_create_ns
  params:
    - { name: encoding, type: string, optional: true }
    - { name: separator, type: string, optional: true }
  flowsToReturn: [0, 1]

- tag: function
  name: xml_parser_free
  params:
    - { name: parser, type: mixed }
  return: bool

- tag: function
  name: xml_parser_get_option
  params:
