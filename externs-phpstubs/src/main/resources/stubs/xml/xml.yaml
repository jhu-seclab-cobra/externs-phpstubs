    - { name: option, type: int }
  return: int

- tag: function
  name: xml_parser_set_option
  params:
    - { name: parser, type: mixed }
    - { name: option, type: int }
    - { name: value, type: mixed }
  return: bool

- tag: function
  name: xml_set_character_data_handler
  params:
    - { name: parser, type: mixed }
