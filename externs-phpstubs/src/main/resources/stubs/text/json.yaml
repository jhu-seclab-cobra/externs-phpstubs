- tag: function
  name: json_decode
  params:
    - { name: json, type: string }
    - { name: associative, type: bool, optional: true }
    - { name: depth, type: int, optional: true }
    - { name: flags, type: int, optional: true }
  flowsToReturn: [0]

- tag: function
  name: json_encode
  params:
    - { name: value, type: mixed }
    - { name: flags, type: int, optional: true }
    - { name: depth, type: int, optional: true }
  return: string
  flowsToReturn: [0]

- tag: function
  name: json_last_error
  return: int

- tag: function
  name: json_last_error_msg
  return: string

