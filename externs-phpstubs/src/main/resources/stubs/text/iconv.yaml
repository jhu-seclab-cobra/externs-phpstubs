- tag: function
  name: iconv_get_encoding
  params:
    - { name: type, type: string, optional: true }
  return: array

- tag: function
  name: iconv_mime_decode
  params:
    - { name: string, type: string }
    - { name: mode, type: int, optional: true }
    - { name: encoding, type: string, optional: true }
  return: string
  flowsToReturn: [0, 2]

- tag: function
  name: iconv_mime_decode_headers
  params:
    - { name: headers, type: string }
    - { name: mode, type: int, optional: true }
    - { name: encoding, type: string, optional: true }
  return: array

- tag: function
  name: iconv_mime_encode
  params:
    - { name: field_name, type: string }
    - { name: field_value, type: string }
    - { name: options, type: array, optional: true }
  return: string
  flowsToReturn: [0, 1]

- tag: function
  name: iconv_set_encoding
  params:
    - { name: type, type: string }
    - { name: encoding, type: string }
  return: bool

- tag: function
  name: iconv_strlen
  params:
    - { name: string, type: string }
    - { name: encoding, type: string, optional: true }
  return: int

- tag: function
  name: iconv_strpos
  params:
    - { name: haystack, type: string }
    - { name: needle, type: string }
    - { name: offset, type: int, optional: true }
    - { name: encoding, type: string, optional: true }
  return: int

- tag: function
  name: iconv_strrpos
  params:
    - { name: haystack, type: string }
    - { name: needle, type: string }
    - { name: encoding, type: string, optional: true }
  return: int

- tag: function
  name: iconv_substr
  params:
    - { name: string, type: string }
    - { name: offset, type: int }
    - { name: length, type: int, optional: true }
    - { name: encoding, type: string, optional: true }
  return: string
  flowsToReturn: [0, 3]

