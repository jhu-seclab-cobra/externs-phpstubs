- tag: function
  name: preg_filter
  params:
    - { name: pattern, type: array }
    - { name: replacement, type: array }
    - { name: subject, type: array }
    - { name: limit, type: int, optional: true }
    - { name: count, type: int, optional: true }
  return: array
  flowsToReturn: [0, 1, 2]

- tag: function
  name: preg_grep
  params:
    - { name: pattern, type: string }
    - { name: array, type: array }
    - { name: flags, type: int, optional: true }
  return: array
  flowsToReturn: [1]

- tag: function
  name: preg_last_error
  return: int

- tag: function
  name: preg_last_error_msg
  return: string

- tag: function
  name: preg_match
  params:
    - { name: pattern, type: string }
    - { name: subject, type: string }
    - { name: matches, type: array, optional: true }
    - { name: flags, type: mixed, optional: true }
    - { name: offset, type: int, optional: true }

- tag: function
  name: preg_match_all
  params:
    - { name: pattern, type: string }
    - { name: subject, type: string }
    - { name: matches, type: array, optional: true }
    - { name: flags, type: int, optional: true }
    - { name: offset, type: int, optional: true }
  return: int

- tag: function
  name: preg_quote
  params:
    - { name: str, type: string }
    - { name: delimiter, type: string, optional: true }
  return: string
  flowsToReturn: [0, 1]

- tag: function
  name: preg_replace
  params:
    - { name: pattern, type: array }
    - { name: replacement, type: array }
    - { name: subject, type: array }
    - { name: limit, type: int, optional: true }
    - { name: count, type: int, optional: true }
  return: array
  flowsToReturn: [0, 1, 2]

- tag: function
  name: preg_replace_callback
  params:
    - { name: pattern, type: array }
    - { name: callback, type: mixed }
    - { name: subject, type: string }
    - { name: limit, type: int, optional: true }
    - { name: count, type: int, optional: true }
    - { name: flags, type: int, optional: true }
  return: string
  flowsToReturn: [1, 2]

- tag: function
  name: preg_replace_callback_array
  params:
    - { name: pattern, type: array }
    - { name: subject, type: string }
    - { name: limit, type: int, optional: true }
    - { name: count, type: int, optional: true }
    - { name: flags, type: int, optional: true }
  return: string
  flowsToReturn: [1]

- tag: function
  name: preg_split
  params:
    - { name: pattern, type: string }
    - { name: subject, type: string }
    - { name: limit, type: int, optional: true }
    - { name: flags, type: int, optional: true }
  return: array

