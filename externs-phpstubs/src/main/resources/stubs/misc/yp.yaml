- tag: function
  name: yp_next
  params:
    - { name: domain, type: string }
    - { name: map, type: string }
    - { name: key, type: string }
  return: array

- tag: function
  name: yp_order
  params:
    - { name: domain, type: string }
    - { name: map, type: string }
  return: int

