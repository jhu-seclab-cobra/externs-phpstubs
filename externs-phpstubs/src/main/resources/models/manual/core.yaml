# Core constants whose value depends on the host, the PHP build or the run, so no value is declared.
# Hand-maintained; PHP extension "core" comes from this file name. A constant without a value reads as an unknown value of its type.
- subject:
    constant: PHP_OS
  signature:
    type: string
- subject:
    constant: PHP_OS_FAMILY
  signature:
    type: string
- subject:
    constant: DIRECTORY_SEPARATOR
  signature:
    type: string
- subject:
