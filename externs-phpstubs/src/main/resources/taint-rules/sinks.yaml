# Hand-maintained taint set in psalm's names, mounted after the generated taint set.
# Sinks follow Jahanshahi & Egele, "Argus: All your (PHP) Injection-sinks are belong to us"
# (USENIX Security 2024), Table 5 and the artifact run, plus the curated lists shipped with it;
# an entry for a subject the taint set already names restates psalm's ports and adds its own.
# Receiver-triggered sinks (methods with no path argument) are not expressible and are omitted.
# The set leaves out the Argus points PHP 8.5.11 contradicts: unserialize on file functions (phar metadata
# is read lazily) and eval on preg_replace, assert, mb_ereg_replace and mb_eregi_replace.
- subject:
    function: array_filter
  sinks:
    - port: argument(1)
      vulnType: callable
- subject:
    function: array_map
  sinks:
    - port: argument(0)
