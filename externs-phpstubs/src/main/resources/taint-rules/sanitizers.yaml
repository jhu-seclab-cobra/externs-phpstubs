# Hand-maintained taint set in psalm's names, mounted after the generated taint set.
# Escapes psalm does not state: per-kind escapes for one category, and value transforms whose
# output alphabet cannot carry an injection for any kind (casts, digests, hex, base64).
# Checks: a type predicate returns true exactly when its argument has one of the `types`;
# a character check returning true accepted an argument whose string conversion lies `within`.
- subject:
    function: addslashes
  sanitizers:
    - categories: [sql]
- subject:
    function: base64_encode
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: basename
  sanitizers:
    - categories: [file]
- subject:
    function: bin2hex
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: boolval
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: crc32
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: ctype_alnum
  sanitizers:
    - check: {argument: argument(0), accepts: true, within: '[A-Za-z0-9]'}
- subject:
    function: ctype_digit
  sanitizers:
    - check: {argument: argument(0), accepts: true, within: '[0-9]'}
- subject:
    function: ctype_xdigit
  sanitizers:
    - check: {argument: argument(0), accepts: true, within: '[0-9A-Fa-f]'}
- subject:
    function: curl_escape
  sanitizers:
    - categories: [html]
- subject:
    function: dbx_escape_string
  sanitizers:
    - categories: [sql]
- subject:
    function: escapeshellarg
  sanitizers:
    - categories: [shell]
- subject:
    function: escapeshellcmd
  sanitizers:
    - categories: [shell]
- subject:
    function: floatval
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: hash
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: hash_hmac
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: htmlentities
  sanitizers:
    - categories: [html]
- subject:
    function: htmlspecialchars
  sanitizers:
    - categories: [html]
- subject:
    function: ingres_escape_string
  sanitizers:
    - categories: [sql]
- subject:
    function: intval
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: is_array
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "array"}
- subject:
    function: is_bool
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "bool"}
- subject:
    function: is_double
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "float"}
- subject:
    function: is_float
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "float"}
- subject:
    function: is_int
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "int"}
- subject:
    function: is_integer
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "int"}
- subject:
    function: is_long
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "int"}
- subject:
    function: is_null
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "null"}
- subject:
    function: is_numeric
  sanitizers:
    - check: {argument: argument(0), accepts: true, within: '[0-9eE.+\-INFA \t\n\r\x0B\f]'}
- subject:
    function: is_object
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "object"}
- subject:
    function: is_scalar
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "int|float|string|bool"}
- subject:
    function: is_string
  sanitizers:
    - check: {argument: argument(0), accepts: true, types: "string"}
- subject:
    function: md5
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: number_format
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: password_hash
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: rawurlencode
  sanitizers:
    - categories: [html]
- subject:
    function: sha1
  sanitizers:
    - categories: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
- subject:
    function: sqlite_escape_string
  sanitizers:
    - categories: [sql]
