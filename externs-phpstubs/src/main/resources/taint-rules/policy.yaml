# `external` reaches every kind `input` reaches, plus xpath; `input` gains xpath and scheme.
# `path` reaches what `external` reaches except scheme.
- sourceKind: input
  enables: [xpath, scheme]
- sourceKind: external
  enables: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath, scheme]
- sourceKind: path
  enables: [html, has_quotes, shell, sql, callable, eval, unserialize, include, ssrf, ldap, file, header, cookie, xpath]
