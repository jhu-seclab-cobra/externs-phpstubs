# Global taint policy: which source kinds make which vulnerability types dangerous.
# Each row lists a source kind and the vulnerability types a value of that source kind
# triggers when it reaches a sink. Every `sourceKind`/`enables` tag must be declared in
# vocabulary.yaml. Editing the matrix is a data-file change — no code change.
- sourceKind: user-input
  enables: [sqli, cmdi, codei, xss, headeri, ssrf, pathtrav, fileinc, deser, callablei, ldapi, xpathi, schemei]
- sourceKind: external-input
  enables: [sqli, cmdi, codei, xss, headeri, ssrf, pathtrav, fileinc, deser, callablei, ldapi, xpathi, schemei]
# A server path value starts with a slash, so a tag attribute value it fills never starts a scheme.
- sourceKind: server-path
  enables: [sqli, cmdi, codei, xss, headeri, ssrf, pathtrav, fileinc, deser, callablei, ldapi, xpathi]
