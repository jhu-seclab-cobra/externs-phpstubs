[versions]
kotlin = "2.4.20"
kover = "0.9.9"
ktlint = "14.2.0"
detekt = "1.23.8"
javaSource = "21"
javaTarget = "21"
cobra-commons-value = "0.1.1"
cobra-commons-phpmodels = "d356ff45becb5983fc66ac544a00df6618ac224b"
junit = "6.1.3"

[libraries]
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.7" }
cobra-commons-value = { module = "com.github.jhu-seclab-cobra:commons-value", version.ref = "cobra-commons-value" }
cobra-commons-phpmodels = { module = "com.github.jhu-seclab-cobra:commons-phpmodels", version.ref = "cobra-commons-phpmodels" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
