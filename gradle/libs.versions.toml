[versions]
kotlin = "2.2.21"
kover = "0.9.1"
ktlint = "14.0.1"
detekt = "1.23.8"
javaSource = "21"
javaTarget = "21"
cobra-commons-value = "0.1.0"
cobra-commons-phpmodels = "0.2.1"
junit = "5.10.2"

[libraries]
cobra-commons-value = { module = "com.github.jhu-seclab-cobra:commons-value", version.ref = "cobra-commons-value" }
cobra-commons-phpmodels = { module = "com.github.jhu-seclab-cobra:commons-phpmodels", version.ref = "cobra-commons-phpmodels" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinx-kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
